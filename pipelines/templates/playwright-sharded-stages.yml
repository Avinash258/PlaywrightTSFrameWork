# Reusable Playwright sharded test stages
# Used by azure-pipelines.yml (default) and azure-pipelines-sharded.yml

parameters:
  - name: nodeVersion
    type: string
    default: '18.x'
  - name: shardTotal
    type: string
    default: '5'
  - name: testResultsDir
    type: string
    default: 'test-results'
  - name: shardTimeoutMinutes
    type: number
    default: 120

stages:
  # ── Quality gate (runs before shards) ─────────────────────────────────────
  - stage: Quality
    displayName: 'Code Quality Checks'
    jobs:
      - job: QualityChecks
        displayName: 'TypeScript & Lint'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: ${{ parameters.nodeVersion }}

          - script: npm ci
            displayName: 'Install Dependencies'

          - script: npm run type-check
            displayName: 'TypeScript Type Check'

          - script: npm run lint
            displayName: 'ESLint Check'
            continueOnError: true

          - script: npm run format -- --check
            displayName: 'Prettier Format Check'
            continueOnError: true

  # ── Sharded test execution + merged report ────────────────────────────────
  - stage: Test
    displayName: 'Sharded Playwright Tests'
    dependsOn: Quality
    jobs:
      - job: PlaywrightTests
        displayName: 'Playwright Shard Tests'
        timeoutInMinutes: ${{ parameters.shardTimeoutMinutes }}
        strategy:
          maxParallel: 5
          matrix:
            Shard1:
              SHARD: '1/5'
              shardIndex: '1'
            Shard2:
              SHARD: '2/5'
              shardIndex: '2'
            Shard3:
              SHARD: '3/5'
              shardIndex: '3'
            Shard4:
              SHARD: '4/5'
              shardIndex: '4'
            Shard5:
              SHARD: '5/5'
              shardIndex: '5'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: ${{ parameters.nodeVersion }}

          - script: npm ci
            displayName: 'Install Dependencies'

          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright Browsers'

          - script: |
              mkdir -p ${{ parameters.testResultsDir }} blob-report
              npx playwright test --shard=$(SHARD)
            displayName: 'Run Playwright tests --shard=$(SHARD)'
            env:
              CI: true
              HEADLESS: true
              WORKERS: 2
              SHARD_INDEX: $(shardIndex)
              SHARD_TOTAL: ${{ parameters.shardTotal }}

          - task: PublishTestResults@2
            displayName: 'Publish shard $(SHARD) JUnit results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '${{ parameters.testResultsDir }}/junit-shard-$(shardIndex).xml'
              testRunTitle: 'Playwright Shard $(SHARD) - Build $(Build.BuildNumber)'
              mergeTestResults: true

          - task: PublishBuildArtifacts@1
            displayName: 'Upload blob report for shard $(SHARD)'
            condition: always()
            inputs:
              pathToPublish: 'blob-report'
              artifactName: 'blob-report-$(shardIndex)'
              publishLocation: 'Container'

      - job: MergeReports
        displayName: 'Merge Shard Reports'
        dependsOn: PlaywrightTests
        condition: always()
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: ${{ parameters.nodeVersion }}

          - script: npm ci
            displayName: 'Install Dependencies'

          - task: DownloadBuildArtifacts@0
            displayName: 'Download all shard blob reports'
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              itemPattern: 'blob-report-*'
              downloadPath: '$(System.ArtifactsDirectory)'

          - script: |
              mkdir -p all-shard-reports test-results
              find "$(System.ArtifactsDirectory)" -type f -path '*/blob-report/*' -exec cp {} all-shard-reports/ \;
              npx playwright merge-reports --config=merge.config.ts ./all-shard-reports
            displayName: 'Merge reports → single HTML + JUnit + JSON'

          - task: PublishTestResults@2
            displayName: 'Publish combined test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/junit.xml'
              testRunTitle: 'Playwright Combined Report - Build $(Build.BuildNumber)'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish merged HTML report'
            condition: always()
            inputs:
              pathToPublish: 'playwright-report'
              artifactName: 'playwright-html-report'
              publishLocation: 'Container'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish merged JSON report'
            condition: always()
            inputs:
              pathToPublish: 'test-results/results.json'
              artifactName: 'playwright-results-json'
              publishLocation: 'Container'

          - script: |
              mkdir -p dashboard-data
              if [ -f "test-results/results.json" ]; then
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
                  const stats = data.stats || {};
                  const total = (stats.expected || 0) + (stats.unexpected || 0) + (stats.skipped || 0);
                  const failed = stats.unexpected || 0;
                  const skipped = stats.skipped || 0;
                  const passed = total - failed - skipped;
                  const metrics = {
                    buildNumber: '$(Build.BuildNumber)',
                    branch: '$(Build.SourceBranchName)',
                    totalTests: total,
                    passedTests: passed,
                    failedTests: failed,
                    skippedTests: skipped,
                    passRate: total > 0 ? Math.round((passed * 100) / total) : 0
                  };
                  fs.writeFileSync('dashboard-data/metrics.json', JSON.stringify(metrics, null, 2));
                  console.log(JSON.stringify(metrics, null, 2));
                "
              fi
            displayName: 'Generate dashboard metrics from merged report'
            condition: always()

          - task: PublishBuildArtifacts@1
            displayName: 'Publish dashboard metrics'
            condition: always()
            inputs:
              pathToPublish: 'dashboard-data'
              artifactName: 'dashboard-data'
              publishLocation: 'Container'
