# Default Azure DevOps Pipeline
# Entry point: uses sharded Playwright template + post-deploy smoke + dashboard
#
# Setup in Azure DevOps:
#   Pipelines → New pipeline → Existing YAML → azure-pipelines.yml

trigger:
  branches:
    include:
      - main
      - develop
      - master
      - feature/*
      - bugfix/*
      - hotfix/*
  paths:
    exclude:
      - README.md
      - .gitignore
      - docs/*
      - '*.md'
  batch: true

pr:
  branches:
    include:
      - main
      - develop
      - master
  paths:
    exclude:
      - README.md
      - .gitignore
      - docs/*
      - '*.md'

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '18.x'
  SHARD_TOTAL: '5'
  TEST_RESULTS_DIR: 'test-results'
  REPORT_DIR: 'playwright-report'

stages:
  # Quality → 5 parallel shards → merged report (from template)
  - template: pipelines/templates/playwright-sharded-stages.yml
    parameters:
      nodeVersion: $(NODE_VERSION)
      shardTotal: $(SHARD_TOTAL)
      testResultsDir: $(TEST_RESULTS_DIR)

  # Post-deployment smoke tests (main branch only)
  - stage: PostDeploymentTests
    displayName: 'Post-Deployment Verification'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTests
        displayName: 'Smoke Tests'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              npm ci
              npx playwright install --with-deps chromium
            displayName: 'Setup'

          - script: |
              mkdir -p test-results
              npm run test:smoke -- --reporter=junit --reporter=html
            displayName: 'Run Smoke Tests'
            env:
              CI: true
              HEADLESS: true

          - task: PublishTestResults@2
            displayName: 'Publish Smoke Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/junit.xml'
              testRunTitle: 'Smoke Tests - Build $(Build.BuildNumber)'

  # Dashboard summary (uses merged report metrics)
  - stage: Dashboard
    displayName: 'Test Dashboard Summary'
    dependsOn:
      - Test
      - PostDeploymentTests
    condition: always()
    jobs:
      - job: GenerateDashboard
        displayName: 'Generate Test Dashboard'
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download dashboard metrics'
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              itemPattern: 'dashboard-data'
              downloadPath: '$(System.ArtifactsDirectory)'

          - script: |
              mkdir -p final-dashboard
              METRICS_FILE=$(find "$(System.ArtifactsDirectory)" -name 'metrics.json' | head -1)
              TOTAL_TESTS="Unknown"
              PASSED_TESTS="Unknown"
              FAILED_TESTS="Unknown"
              PASS_RATE="Unknown"

              if [ -n "$METRICS_FILE" ] && [ -f "$METRICS_FILE" ]; then
                TOTAL_TESTS=$(node -e "console.log(require('$METRICS_FILE').totalTests ?? 'Unknown')")
                PASSED_TESTS=$(node -e "console.log(require('$METRICS_FILE').passedTests ?? 'Unknown')")
                FAILED_TESTS=$(node -e "console.log(require('$METRICS_FILE').failedTests ?? 'Unknown')")
                PASS_RATE=$(node -e "console.log(require('$METRICS_FILE').passRate ?? 'Unknown')")
              fi

              cat > final-dashboard/README.md << EOF
              # Test Execution Dashboard

              - **Build:** $(Build.BuildNumber)
              - **Branch:** $(Build.SourceBranchName)
              - **Total Tests:** ${TOTAL_TESTS}
              - **Passed:** ${PASSED_TESTS}
              - **Failed:** ${FAILED_TESTS}
              - **Pass Rate:** ${PASS_RATE}%
              EOF

              cat > final-dashboard/dashboard.html << EOF
              <!DOCTYPE html>
              <html>
              <head><title>Test Dashboard - Build $(Build.BuildNumber)</title></head>
              <body>
                <h1>Test Execution Dashboard</h1>
                <p>Build $(Build.BuildNumber) | Branch $(Build.SourceBranchName)</p>
                <ul>
                  <li>Total Tests: ${TOTAL_TESTS}</li>
                  <li>Passed: ${PASSED_TESTS}</li>
                  <li>Failed: ${FAILED_TESTS}</li>
                  <li>Pass Rate: ${PASS_RATE}%</li>
                </ul>
              </body>
              </html>
              EOF
            displayName: 'Generate Final Dashboard'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Final Dashboard'
            condition: always()
            inputs:
              pathToPublish: 'final-dashboard'
              artifactName: 'test-dashboard'
              publishLocation: 'Container'
